<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommutePool - Smart Carpooling Login & Sign Up</title>
  <meta name="description"
    content="Sign in or create an account to start sharing rides and reducing your daily commute costs." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.75);
      --border-card: rgba(255, 255, 255, 0.12);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: #60a5fa;
      --radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px;
    }

    .background-globes {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .globe {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: floatGlobe 12s infinite alternate ease-in-out;
    }

    .globe-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
      top: -100px;
      left: -100px;
    }

    .globe-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #10b981 0%, #047857 100%);
      bottom: -150px;
      right: -150px;
      animation-delay: -6s;
    }

    @keyframes floatGlobe {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(60px, 40px) scale(1.1);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo svg {
      color: var(--primary);
      filter: drop-shadow(0 0 10px var(--primary-glow));
    }

    .logo strong {
      color: var(--primary);
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.1);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .sub-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .sub-tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .sub-tab-btn.active {
      border-color: var(--primary);
      color: var(--text-main);
      background: rgba(59, 130, 246, 0.15);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot-link,
    .otp-link,
    .terms-link {
      color: var(--primary);
      font-size: 0.8rem;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }

    .forgot-link:hover,
    .otp-link:hover,
    .terms-link:hover {
      text-decoration: underline;
      color: var(--input-focus);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition);
    }

    input::placeholder {
      color: rgba(148, 163, 184, 0.6);
    }

    input:focus,
    select:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .toggle-pass:hover {
      opacity: 1;
    }

    .phone-wrapper {
      gap: 8px;
    }

    .phone-wrapper select {
      width: 110px;
      cursor: pointer;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .role-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .role-card input[type="radio"] {
      display: none;
    }

    .role-card.active {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    .role-icon {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .role-title {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .role-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .form-options {
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .toast {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
      text-align: center;
      transition: var(--transition);
    }

    .toast.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--accent);
      color: #a7f3d0;
    }

    .toast.info {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid var(--primary);
      color: #bfdbfe;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 18px;
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="background-globes">
    <div class="globe globe-1"></div>
    <div class="globe globe-2"></div>
  </div>

  <div class="container">
    <header class="brand-header">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <path d="M9 17h6" />
          <circle cx="17" cy="17" r="2" />
        </svg>
        <span>Commute<strong>Pool</strong></span>
      </div>
      <p class="tagline">Share your ride, save costs & reduce carbon footprint.</p>
    </header>

    <main class="auth-card">
      <nav class="auth-tabs" role="tablist">
        <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">
          Sign In
        </button>
        <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">
          Create Account
        </button>
      </nav>

      <div id="toast" class="toast hidden"></div>

      <!-- PANEL 1: SIGN IN -->
      <section id="panel-login" class="auth-panel">
        <div class="sub-tabs">
          <button id="login-type-email" class="sub-tab-btn active" onclick="switchLoginMethod('email')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            Email
          </button>
          <button id="login-type-phone" class="sub-tab-btn" onclick="switchLoginMethod('phone')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            Phone Number
          </button>
        </div>

        <!-- Email Form -->
        <form id="form-email-login" onsubmit="handleLoginSubmit(event, 'email')">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="login-email" placeholder="name@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="login-email-pass">Password</label>
              <button type="button" class="forgot-link" onclick="handleForgotPassword(event)">Forgot?</button>
            </div>
            <div class="input-wrapper">
              <input type="password" id="login-email-pass" placeholder="••••••••" required />
              <button type="button" class="toggle-pass" onclick="togglePass('login-email-pass', this)"
                aria-label="Toggle password">👁️</button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <!-- Phone Form -->
        <form id="form-phone-login" class="hidden" onsubmit="handleLoginSubmit(event, 'phone')">
          <div class="form-group">
            <label for="login-phone">Phone Number</label>
            <div class="input-wrapper phone-wrapper">
              <select id="login-country-code">
                <option value="+1">+1 (US/CA)</option>
                <option value="+91" selected>+91 (IN)</option>
                <option value="+44">+44 (UK)</option>
                <option value="+61">+61 (AU)</option>
              </select>
              <input type="tel" id="login-phone" placeholder="98765 43210" pattern="[0-9]{8,12}" required />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="login-phone-otp">OTP / Passcode</label>
              <button type="button" class="otp-link" onclick="requestOTP(event)">Get OTP</button>
            </div>
            <div class="input-wrapper">
              <input type="password" id="login-phone-otp" placeholder="6-digit code" pattern="[0-9]{6}" required />
            </div>
          </div>

          <button type="submit" class="btn-primary">Sign In with Phone</button>
        </form>
      </section>

      <!-- PANEL 2: CREATE ACCOUNT -->
      <section id="panel-register" class="auth-panel hidden">
        <form id="form-register" onsubmit="handleRegisterSubmit(event)">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="reg-name" placeholder="Alex Morgan" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-email">Email Address</label>
              <div class="input-wrapper">
                <input type="email" id="reg-email" placeholder="name@example.com" required />
              </div>
            </div>

            <div class="form-group">
              <label for="reg-phone">Phone Number</label>
              <div class="input-wrapper">
                <input type="tel" id="reg-phone" placeholder="9876543210" pattern="[0-9]{8,12}" required />
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-pass">Password</label>
              <div class="input-wrapper">
                <input type="password" id="reg-pass" placeholder="Min. 8 chars" minlength="8" required />
                <button type="button" class="toggle-pass" onclick="togglePass('reg-pass', this)"
                  aria-label="Toggle password">👁️</button>
              </div>
            </div>

            <div class="form-group">
              <label for="reg-confirm-pass">Confirm Password</label>
              <div class="input-wrapper">
                <input type="password" id="reg-confirm-pass" placeholder="Re-enter password" minlength="8" required />
                <button type="button" class="toggle-pass" onclick="togglePass('reg-confirm-pass', this)"
                  aria-label="Toggle confirm password">👁️</button>
              </div>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="agree-terms" required />
              <span>I agree to the <a href="#" class="terms-link">Terms of Service</a> & <a href="#"
                  class="terms-link">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="btn-primary">Create Account</button>
        </form>
      </section>

      <footer class="auth-footer">
        <p id="footer-login-prompt">
          Don't have an account? <a href="#" onclick="switchAuthTab('register'); return false;">Create one now</a>
        </p>
        <p id="footer-register-prompt" class="hidden">
          Already registered? <a href="#" onclick="switchAuthTab('login'); return false;">Sign in here</a>
        </p>
      </footer>
    </main>
  </div>

  <script>
    function switchAuthTab(tab) {
      const loginTabBtn = document.getElementById('tab-login');
      const registerTabBtn = document.getElementById('tab-register');
      const loginPanel = document.getElementById('panel-login');
      const registerPanel = document.getElementById('panel-register');
      const footerLogin = document.getElementById('footer-login-prompt');
      const footerRegister = document.getElementById('footer-register-prompt');

      hideToast();

      if (tab === 'login') {
        loginTabBtn.classList.add('active');
        registerTabBtn.classList.remove('active');
        loginPanel.classList.remove('hidden');
        registerPanel.classList.add('hidden');
        footerLogin.classList.remove('hidden');
        footerRegister.classList.add('hidden');
      } else {
        registerTabBtn.classList.add('active');
        loginTabBtn.classList.remove('active');
        registerPanel.classList.remove('hidden');
        loginPanel.classList.add('hidden');
        footerRegister.classList.remove('hidden');
        footerLogin.classList.add('hidden');
      }
    }

    function switchLoginMethod(method) {
      const emailBtn = document.getElementById('login-type-email');
      const phoneBtn = document.getElementById('login-type-phone');
      const emailForm = document.getElementById('form-email-login');
      const phoneForm = document.getElementById('form-phone-login');

      hideToast();

      if (method === 'email') {
        emailBtn.classList.add('active');
        phoneBtn.classList.remove('active');
        emailForm.classList.remove('hidden');
        phoneForm.classList.add('hidden');
      } else {
        phoneBtn.classList.add('active');
        emailBtn.classList.remove('active');
        phoneForm.classList.remove('hidden');
        emailForm.classList.add('hidden');
      }
    }

    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function updateRoleSelection(radio) {
      const cards = document.querySelectorAll('.role-card');
      cards.forEach(card => card.classList.remove('active'));
      radio.closest('.role-card').classList.add('active');
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.remove('hidden');
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('hidden');
    }

    function requestOTP(event) {
      event.preventDefault();
      const phoneInput = document.getElementById('login-phone');
      const code = document.getElementById('login-country-code').value;
      if (!phoneInput.value) {
        showToast('Please enter a valid phone number first.', 'info');
        phoneInput.focus();
        return;
      }
      showToast(`OTP sent to ${code} ${phoneInput.value}. (Mock OTP: 123456)`, 'success');
    }

    function handleForgotPassword(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      if (email) {
        showToast(`Password reset link sent to ${email}`, 'success');
      } else {
        showToast('Please enter your email address to reset password.', 'info');
        document.getElementById('login-email').focus();
      }
    }

    function handleLoginSubmit(event, method) {
      event.preventDefault();
      if (method === 'email') {
        const email = document.getElementById('login-email').value;
        showToast(`Welcome back! Logged in as ${email}`, 'success');
      } else {
        const code = document.getElementById('login-country-code').value;
        const phone = document.getElementById('login-phone').value;
        showToast(`Verified! Logged in with ${code} ${phone}`, 'success');
      }
    }

    function handleRegisterSubmit(event) {
      event.preventDefault();
      const pass = document.getElementById('reg-pass').value;
      const confirmPass = document.getElementById('reg-confirm-pass').value;

      if (pass !== confirmPass) {
        showToast('Passwords do not match. Please try again.', 'info');
        return;
      }

      const name = document.getElementById('reg-name').value;
      const role = document.querySelector('input[name="user-role"]:checked').value;
      const roleLabel = role === 'driver' ? 'Driver' : 'Passenger';

      showToast(`Account created for ${name} (${roleLabel})! Redirecting...`, 'success');
    }
  </script>
</body>

</html>
